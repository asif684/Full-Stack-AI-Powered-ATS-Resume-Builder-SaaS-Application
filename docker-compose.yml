version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-builder-postgres
    environment:
      POSTGRES_USER: resume_builder
      POSTGRES_PASSWORD: resume_builder_dev
      POSTGRES_DB: resume_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_builder -d resume_builder"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Redis for session caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: resume-builder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: